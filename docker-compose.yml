# Base de données locale du projet.
# Le nom de projet `infos-elus` est figé pour rester compatible avec le volume
# et le conteneur existants (le dossier a été renommé en `info-elus` depuis).
name: infos-elus

services:
  postgres:
    image: postgres:17-alpine
    container_name: infos-elus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infos_elus_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: infos_elus
    # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL local.
    ports:
      - '5433:5432'
    volumes:
      - infos_elus_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infos_elus_user -d infos_elus']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infos_elus_data:
